name: CI - webapp
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Refresh vulnerable transitive lock entries
        run: |
          npm audit fix --package-lock-only
          echo "===LOCKFILE_BEGIN==="
          cat package-lock.json
          echo "===LOCKFILE_END==="
          npm ci

      - name: Lint (se existir)
        run: |
          if npm run | grep -q "lint"; then npm run lint; else echo "sem script lint"; fi

      - name: Test
        run: |
          if npm run | grep -q "test"; then npm test; else echo "sem script test"; fi

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build
        run: |
          if npm run | grep -q "build"; then npm run build; else echo "sem script build"; fi
